id = "etendo.jira-worklog"
name = "Jira Worklog"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Borrador diario del worklog de Jira, por ticket, armado con los transcripts de los agentes."
platforms = ["macos", "linux"]

[[actions]]
id = "today"
title = "Worklog: ver hoy"
command = ["python3", "worklog.py", "show", "--date", "today"]

[[actions]]
id = "yesterday"
title = "Worklog: ver día hábil anterior"
command = ["python3", "worklog.py", "show", "--date", "yesterday"]

[[actions]]
id = "open-today"
title = "Worklog: abrir archivo de hoy"
command = ["python3", "worklog.py", "open", "--date", "today"]

[[panes]]
id = "view"
title = "Worklog"
placement = "popup"
width = "90%"
height = "90%"
command = ["python3", "worklog.py", "view"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "worklog.py", "hook"]
